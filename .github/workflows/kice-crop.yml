name: Temporary KICE Crop

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip requests pymupdf pillow
      - run: python scripts/run_builder_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: kice-official-calculus
          path: out/
          if-no-files-found: error
