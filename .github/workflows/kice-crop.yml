name: Temporary KICE Crop

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip requests pymupdf pillow
      - run: python scripts/inspect_modern_csat.py
      - uses: actions/upload-artifact@v4
        with:
          name: modern-csat-inspection
          path: inspect_csat/
          if-no-files-found: error
